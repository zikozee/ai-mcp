server:
  port: 8084


spring:
  application:
    name: hr-service


  datasource:
    url: jdbc:postgresql://localhost:5432/hr_db
    username: postgres
    password: postgres


  flyway:
    enabled: true
    locations:
      - classpath:db/migration


  ai:
    mcp:
      server:
        enabled: true
        protocol: stateless
