server:
  port: 8082


spring:
  application:
    name: deployment-service


  datasource:
    url: jdbc:postgresql://localhost:5433/deployment_db
    username: postgres
    password: postgres


  flyway:
    enabled: true
    locations:
      - classpath:db/migration

  ai:
    mcp:
      server:
        enabled: true
        protocol: stateless


security:
  jwt:
    # note 127.0.0.1 is not the same as local host for the issuer validation
    issuer: ${JWKS_ISSUER:http://127.0.0.1:8080}