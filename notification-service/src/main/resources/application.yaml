server:
  port: 8083

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: postgres

  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        enabled: true
        protocol: STATELESS
